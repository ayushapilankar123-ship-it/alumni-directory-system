<!DOCTYPE html>
<html>
<head>
    <title>Alumni Registration</title>
</head>
<body>

<h2>Alumni Registration Form</h2>

<form id="registerForm">
    <input type="text" id="name" placeholder="Name"><br><br>

    <input type="email" id="email" placeholder="Email"><br><br>

    <input type="password" id="password" placeholder="Password"><br><br>

    <input type="text" id="graduationYear" placeholder="Graduation Year"><br><br>

    <input type="text" id="company" placeholder="Company"><br><br>

    <input type="text" id="jobRole" placeholder="Job Role"><br><br>

    <button type="submit">Register</button>
</form>

<script>
    document.getElementById("registerForm").addEventListener("submit", async function(e) {

        e.preventDefault();

        const user = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            graduationYear: document.getElementById("graduationYear").value,
            company: document.getElementById("company").value,
            jobRole: document.getElementById("jobRole").value
        };

        const response = await fetch("http://localhost:8080/users/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(user)
        });

        const data = await response.json();

        alert("User Registered Successfully!");
        console.log(data);
    });
</script>

</body>
</html>
